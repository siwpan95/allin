[project]
name = "allin-kernel"
version = "0.1.0"
description = "allin 治理内核：制度 + 文档枢纽 + 执行器的 Python/Cordis 服务图引擎"
license = { text = "MIT-0" }
requires-python = ">=3.12"
# 2026-11-08 深度审核：kernel/tree.py 在导入期 `import yaml`，vendored cordis
# 亦依赖 PyYAML。此前声明 dependencies=[] 却声称「无需 pip 安装即可自举」，
# 裸环境连 `allin --help` 都跑不起来。如实声明运行时依赖。
dependencies = ["PyYAML>=6.0"]
