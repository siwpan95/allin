# ports.yaml —— 端口分配表的机器可读版（平台/工具消费；人类可读版仍为 端口分配表.md）
# 规则：新服务先查本表再选端口；占用 = 同时改本文件与 端口分配表.md；禁止口头约定。
# 生成/更新：2026-08-25（平台立项 P0）；2026-08-27 目录重构更新 owner 路径 + 三仓编排 harness（probe 只读既有 9000，无新增端口）；2026-09-24 登记 zhuangtaiji 8011

segments:
  - range: 8000-8099
    purpose: 用户面板/媒体服务
    reserved: 8020-8099
  - range: 8800-8999
    purpose: 媒体子协议/本地代理
    reserved: 8900-8999
  - range: 9000-9099
    purpose: 聚合门户/平台前台
  - range: 9900-9999
    purpose: 内部控制 API
    reserved: 9900-9996

ports:
  - port: 8000
    service: radio-panel
    owner: /repos/private-radio-stations/apps/audio
    paths: [/stream, /stream/64, /stream/320, /hls/*]
    status: active
  - port: 8010
    service: mixer-stream
    owner: /repos/musickit/remix/tools
    entry: mixer_stream.py
    status: active
  - port: 8011
    service: zhuangtaiji-webui
    owner: /repos/zhuangtaiji/web/server.py
    paths: [/, /api/orchestrations, /api/orchestration/*]
    note: 多范式决策引擎的 Web 编排编辑器；按需启动（默认端口，可显式传参覆盖）
    status: active
  - port: 8080
    service: audio-separator-web
    owner: /repos/audio-separator/web_server
    note: --port 默认值，启动时需显式确认
    status: active
  - port: 8100
    service: video-panel
    owner: /repos/private-radio-stations/apps/video
    status: active
  - port: 8554
    service: mediamtx-rtsp
    owner: MediaMTX
    status: active
  - port: 8787
    service: localplayer-bridge
    owner: /repos/private-radio-stations/scripts/localplayer-bridge.mjs
    start: npm run bridge（或双击 start-bridge.bat）
    env: LP_BRIDGE_PORT（可覆盖默认 8787）
    paths: [/api/list, /api/health]
    consumer: /repos/localplayer（plugins/radio-stations-source.js，priority 15）
    note: 聚合桥 —— 把电台直播/预设/IPTV 频道/录制回放/MediaMTX HLS 聚合成播放器清单；只读清单，不提供 /api/relay/* 等写接口（启停转播仍在电台面板）。桥不在线时消费端静默降级
    status: active
  - port: 8888
    service: mediamtx-hls
    owner: MediaMTX
    status: active
  - port: 8889
    service: mediamtx-webrtc
    owner: MediaMTX
    status: active
  - port: 8899
    service: npm-mirror-proxy
    owner: start-*.bat PROXY_PORT
    note: 仅安装期
    status: transient
  - port: 9000
    service: portal
    owner: /platform/apps/portal（按需启动：start-platform.bat，默认 PORT=0 临时端口）
    note: 2026-08-27 起不再常驻 9000——门户为独立网页应用按需启动（双击 start-platform.bat 自动打开浏览器，关闭即释放）；9000 仅作手动模式可选端口
    status: retired
  - port: 9997
    service: mediamtx-api
    owner: mediamtx
    status: active

change_log:
  - date: 2026-08-24
    change: 建表；登记门户 9000
  - date: 2026-08-25
    change: 机器可读版落地（平台立项 P0）；与 端口分配表.md 同步
  - date: 2026-08-27
    change: 目录重构后更新 owner 路径（repos/platform）
  - date: 2026-08-27
    change: portal 9000 退役——门户改为 DSH 插件版（临时端口，释放固定端口占用）
  - date: 2026-09-24
    change: 登记 zhuangtaiji Web 编排编辑器 8011——其文档原默认 8000 与已 active 的 radio-panel 冲突；默认端口改 8011，README/README.en/server.py 已同步
  - date: 2026-09-24
    change: 登记 localplayer-bridge 8787——聚合桥（private-radio-stations scripts/localplayer-bridge.mjs，npm run bridge），把电台/IPTV/录制/HLS 聚合成 localplayer 播放器清单；消费端 /repos/localplayer plugins/radio-stations-source.js（priority 15）。此前该端口在本表缺席（登记时发现：8787 偏离 88xx-89xx 段约定，且落在 8000-8099 与 8800-8999 之间的空档，段划分待后续统一）
