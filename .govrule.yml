# govrule 的仓级配置：**本仓**的政策，不是判据的性质。
#
# 为什么单独一个文件：同一套判据在不同仓里要有不同的冻结区。
# 把冻结写进规则，等于让一个仓的政策污染所有仓（实测：`docs/记录/` 在本仓
# 明确「只增不改」，坏链无法通过改文档修复；而 govrule 仓的 `docs/记录/` 必须保持可跳转）。
exclude:
  # 历史记录：`docs/记录/README.md` 写死「只增不改，用追加勘误节，不重写正文」。
  # 因此这些文件里的失效链接**不可修**——修它就违反本仓自己的契约。
  g19.links-resolve:
    - "docs/记录/**"
  g19.command-targets:
    - "docs/记录/**"
