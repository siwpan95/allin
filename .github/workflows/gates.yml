# allin 治理门禁 · GitHub Actions（GitHub 镜像侧）
#
# 与 .workflow/pipeline.yml（Gitee Go）跑**同一套命令** —— 两边必须同绿，
# 否则「主仓绿、镜像红」本身就是一个没人发现的矛盾。
#
# 为什么两侧都要有：
#   Gitee 是主仓（铁律 0：公开 + MIT），但 Gitee Go 的流水线**只能手动在
#   Web 控制台开通**（API 无流水线端点，实测 /pipelines 与 /pipeline 均 404），
#   且 Gitee 侧无 PR 讨论生态；
#   GitHub 镜像承载了 Issues / PR / Discussions 这条外部反馈通道
#   （REC-AU-20 §F3 反馈断层的整改落点），外部人的第一个 PR 会开在这里。
#
# 判据（与 Gitee Go 侧一致，两边不允许漂移）：
#   1. Linux 上跑 19 道门禁；g20-facts 是 Windows 专属（platforms=["nt"]），
#      判本机磁盘路径存在性，CI 上无语义，按平台跳过而不是假装通过。
#   2. g17-registry 在 CI 上必然 SKIP（not a pass）——发布区不在本仓内。
#      SKIP ≠ 通过，所以这个 job 不声称「20/20 全绿」。
#   3. --no-profile：g14-preset 的 profile 探针读 DSH 部署面，CI 上不存在。
#   4. --no-aliases：docs/spec 等 ASCII 别名是 junction/symlink，不入库。
#   5. Windows job 补跑 g20-facts —— 那一道只有 Windows 能判，且它判的正是
#      「本机事实声称与磁盘是否一致」，在 Windows runner 上才有本机磁盘。
#      这是本仓唯一「两套 runner 各跑一部分」的分工，两边合起来才是 20 道。

name: governance-gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates-posix:
    name: 治理门禁（Linux · 19 道跨平台 + 别名）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # g12-integrity 要解析 HEAD 可达对象；浅克隆会让它判不全

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 这一步刻意**完全按上手指南的三条命令来跑**：
      #   bash scripts/bootstrap.sh  →  bash scripts/run_all_gates.sh
      # 因为它同时验证了两件事：① 20 道门禁在陌生 Linux 机器上跑绿；
      # ② 指南里写的那条「10 分钟上手」路径**真的能跑**（否则指南就是空头承诺）。
      # 若这里失败，说明的不是「CI 环境有问题」，而是「用户照文档做会失败」。
      - name: bootstrap（按上手指南的三条命令）
        run: bash scripts/bootstrap.sh

      - name: 全部门禁（与本地同一条命令）
        env:
          ALLIN_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: bash scripts/run_all_gates.sh

      - name: 本仓 monorepo 自检
        run: |
          .venv/bin/python tools/repocheck/main.py . \
            --exclude tools,vendor,preset,packages,scripts --skip-rules 1,7 --fail-on error

      # packages/ 是 monorepo 的中间目录（与 tools/ 同类），所以在上面一行被排除；
      # 它内部的**单个包**要单独按「子件」口径体检 —— 与 README §本仓自检口径 B)
      # 检查体检器自身是同一个做法：排除中间层（src/tests）、跳过 1/2/4/5 四条
      # 「一个独立仓才该有」的规则。
      - name: 可安装包自检（packages/allin-governance）
        run: |
          .venv/bin/python tools/repocheck/main.py packages/allin-governance \
            --exclude src,tests --skip-rules 1,2,4,5 --fail-on error

      - name: 可安装包单测（allin-governance CLI 包装边界 + init 边界）
        run: |
          .venv/bin/python -m pytest packages/allin-governance -q

      # D1.1 的验收判据就在这里：装 wheel → 在一个**与仓无关**的目录里 init →
      # 那条 `npm run check:governance` 必须 exit 0。
      # 刻意不测「代码写了什么」而测「陌生人拿到包能不能跑起来」：
      # 目标目录建在 $RUNNER_TEMP，不继承仓内任何文件、别名或 venv。
      - name: 可安装包 init 端到端（生成骨架 → 跑门禁）
        run: |
          python -m venv "$RUNNER_TEMP/ag"
          "$RUNNER_TEMP/ag/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/ag/bin/python" -m pip install --quiet packages/allin-governance
          "$RUNNER_TEMP/ag/bin/allin-governance" init "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          npm run check:governance

  gates-windows:
    name: 治理门禁（Windows · 完整 20 道，含 g20-facts）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Windows job 必须与 Linux 走**同一条**上手路径，否则会出现
      # 「Linux 绿、Windows 红」这种最难查的不一致 —— 2026-10-31 就发生过一次：
      # 该 job 原先直接跑裸门禁、不跑 bootstrap，于是 docs/spec 等 junction
      # 从未被创建，g15 的 D6 报 4 条红，Windows job 挂在一个纯属「步骤顺序」
      # 的问题上，与门禁本身无关。
      - name: bootstrap（按上手指南的三条命令）
        shell: bash
        run: bash scripts/bootstrap.sh

      # Windows 是**唯一能跑全 20 道**的平台：g20-facts 声明 platforms=["nt"]，
      # 判的是本机磁盘路径的存在性声称。Linux job 会把它记为 SKIPPED。
      # 两个 job 合起来才是「已知的全部判据都被跑过」。
      - name: 全部门禁（Windows 完整 20 道）
        shell: bash
        env:
          ALLIN_PYTHON: ${{ github.workspace }}/.venv/Scripts/python.exe
        run: bash scripts/run_all_gates.sh

      # 同一条验收判据在 Windows 上再跑一次。这不是重复劳动：
      # 这套门禁的判据里有一部分（盘符字面量、CRLF、junction）只在 Windows 上有语义，
      # 「一个骨架在 Linux 上绿」推不出「在 Windows 上也绿」—— 本仓已经因为
      # 「只有一台机器验过」吃过四次亏（见 REC-AU-21 §7.2）。
      - name: 可安装包 init 端到端（Windows）
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ag"
          "$RUNNER_TEMP/ag/Scripts/python.exe" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/ag/Scripts/python.exe" -m pip install --quiet packages/allin-governance
          "$RUNNER_TEMP/ag/Scripts/allin-governance.exe" init "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          npm run check:governance
