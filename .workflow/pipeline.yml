# allin 治理门禁 · Gitee Go 流水线
#
# 这条流水线回答一个问题：**「治理模式自己能不能在一台陌生机器上跑绿？」**
# —— 即 SPEC-105 承诺的「可复制」是否成立。此前 allin 的 20 道门禁只在作者
# 本机的三台机器上跑过，**从没有任何一次外部可复现的证据**（REC-AU-20 §F5
# 单点断层的核心缺口）。这条流水线是那个证据的载体。
#
# 为什么需要它（对应 docs/新人开发上手指南.md 附录 A 第 4 条）：
# 本仓此前**没有任何 CI 配置**。门禁只在本地跑 ⇒ 「20/20 全绿」这一结论
# 只有作者自己能看到，外部无法复核 ⇒ 治理体系的可信度无法被外部验证。
#
# ⚠ 启用前提（**这一步必须手动做，API 做不到**）：
#   Gitee 仓库页 → DevOps → Gitee Go → 同意并开通 → 新建流水线 → 代码视图 →
#   粘贴本文件内容 → 保存。开通后 Gitee Go 会接管本文件。
#   （实测：Gitee API v5 无「流水线」端点，`/pipelines` 与 `/pipeline` 均 404，
#     故流水线只能走 Web 控制台开通与保存；本文件是开通后的「代码视图」内容源。）
#   文件命名按 Gitee Go 惯例放在 `.workflow/` 下，本仓用 `pipeline.yml`。
#
# 关键设计（每条都有判据，不是随手写的）：
#   1. **门禁在 Linux 上跑 19 道，不跑 g20-facts** —— g20-facts 是 Windows 专属
#      （registry.json 里 platforms=["nt"]），判的是本机磁盘路径的存在性声称，
#      在 CI 上没有对应语义。跑它等于跑一个「假装有本机磁盘」的假检查。
#   2. **g17-registry 在 CI 上必然 SKIP（not a pass）** —— 它判发布区每个仓是否
#      已登记，而发布区（repos/）不在本仓内。门禁契约规定 SKIP ≠ 通过，
#      所以 CI 不能声称「20/20 全绿」，只能声称「19 道跨平台门禁全绿 +
#      1 道按平台跳过」。
#   3. **不用 --profile** —— g14-preset 的 profile 探针读的是 DSH 部署面
#      （$DSH_HOME/profiles/...），CI 上不存在。跑纯仓内自检（--no-profile）。
#   4. **别名不重建** —— docs/spec 等 ASCII 别名是 junction/symlink，不入库；
#      Linux 上用 --no-aliases 跳过 D6（见 docs_index.py 的该开关）。
#   5. **用清华镜像装依赖** —— CI 机器在境内，默认 PyPI 源常超时；换源不是
#      优化，是让流水线能跑完的前提。
#
# 失败时怎么办：先看是哪一道门禁红了，再对照 tools/gate/governance/RULES.md
# 里那道门禁的「判定依据」列 —— 那里写清了它到底在判什么、基线在哪。

version: "1.0"
name: allin-governance-gates
displayName: allin 治理门禁（20 道）

stages:
  - name: gates
    displayName: 门禁全量
    strategy: fast
    trigger: auto
    steps:
      - step: build@python
        name: install_deps
        displayName: 装 Python 依赖
        pythonVersion: "3.13"
        commands:
          - python3 -m venv .venv
          - .venv/bin/python -m pip install --upgrade pip
          - .venv/bin/python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements-dev.txt
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      - step: build@nodejs
        name: run_gates
        displayName: 治理门禁（19 道跨平台；g20-facts 为 Windows 专属，按平台跳过）
        nodeVersion: "22"
        commands:
          - node --version
          - export ALLIN_PYTHON="$PWD/.venv/bin/python"
          - node tools/gate/governance/run.ts --no-profile
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      # 2026-11-08 审查闭环 B1：platform 集成/接口测试接入 Gitee Go 流水线
      # （与 GitHub 侧 platform-test job 同口径，两侧不允许漂移）。
      - step: build@nodejs
        name: platform_test
        displayName: 平台集成/接口测试（node --test）
        nodeVersion: "22"
        commands:
          - npm ci --prefix platform
          - npm --prefix platform test
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      # 2026-11-08 审查闭环 S7：Python SAST / 依赖审计实跑。
      # 与 GitHub 侧 gates.yml 的 python-sast job 调**同一脚本、同一先自检后实跑**口径，
      # 两侧不允许漂移。shadow mode：发现不阻断，基础设施失败 exit 3 阻断。
      # Gitee Go 的多个 command 不共享 shell 会话，故自检与实跑用**一条**命令串起（&&），
      # 不依赖跨 command 的 export / cwd；build@python 提供 python3（与 install_deps 一致）。
      #
      # PIP_INDEX_URL 指清华镜像：脚本内部要 `pip install -r requirements-sast.txt` 装钉版
      # bandit / pip-audit，境内直连 PyPI 会超时（与 install_deps 用同一镜像源，不是优化而是前提）。
      # 注意这是**安装**环节的镜像；依赖漏洞审计的数据源是 pip-audit 的 `-s osv`（脚本内固定），
      # 两者不是同一件事，改一个不影响另一个。
      - step: build@python
        name: python_sast
        displayName: Python SAST + 依赖审计（shadow mode · 实跑）
        pythonVersion: "3.13"
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        commands:
          - bash scripts/run-python-sast.sh --selfcheck && bash scripts/run-python-sast.sh
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      - step: build@python
        name: check_docs_index
        displayName: 文档别名 + 文档索引契约（D6 完整判）
        pythonVersion: "3.13"
        commands:
          - bash scripts/bootstrap.sh
          - .venv/bin/python tools/gate/docs_index.py
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      - step: build@python
        name: repocheck_self
        displayName: 本仓 monorepo 自检（README §本仓自检口径）
        pythonVersion: "3.13"
        commands:
          - .venv/bin/python tools/repocheck/main.py . --exclude tools,vendor,preset,packages,scripts --skip-rules 1,7 --fail-on error
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      # 2026-11-04 工程审查 P1-4：密钥增量扫描。与 GitHub 侧调**同一对**脚本
      # scripts/install-gitleaks.sh + scripts/scan-secrets.sh，判据不允许漂移；
      # 本侧触发的是 push/master，未显式传基线时脚本回退到 origin/master 分叉点 / HEAD~1。
      # 安装脚本把二进制固定落在 /tmp/gitleaks-8.18.4/gitleaks，scan-secrets.sh 按同一
      # 路径兜底发现 —— Gitee Go 的多个 command 不共享 shell 会话，故不依赖 export/PATH。
      # 不再用 go install：ubuntu-latest 迁到 Ubuntu 26 后，编译 2024 年的 v8.18.4
      # 在 CI 首跑实测 exit 1；改为官方 release 预编译二进制 + 官方 checksums.txt
      # SHA256 校验。境内 runner 若直连 github.com release 超时，可设 GITLEAKS_BASE_URL
      # 指向可达镜像（镜像需同时提供同名 tarball 与 checksums.txt，校验逻辑不变）。
      # 注意：Gitee Go 需手动开通（见文件头），外部 PR 通道在 GitHub 镜像侧。
      - step: build@python
        name: secrets_scan
        displayName: 密钥增量扫描（gitleaks · 与 GitHub 侧同一脚本）
        pythonVersion: "3.13"
        commands:
          # 与 GitHub 侧同口径：先跑过滤器自检（不需要 gitleaks/网络），再装扫描器并实扫。
          - bash scripts/scan-secrets.sh --selftest && bash scripts/install-gitleaks.sh && bash scripts/scan-secrets.sh
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      # D1.1 的验收判据：装 wheel → 在与仓无关的临时目录里 init → 门禁必须 exit 0。
      # 与 GitHub 侧同一条判据：两边都跑，否则「主仓绿、镜像红」就是一个没人发现的矛盾。
      # 整条链写在一个 command 里：Gitee Go 的多个 command 不保证共享同一个 shell 会话，
      # 拆开写会让 `cd` 与上一行的 venv 丢掉。
      - step: build@python
        name: init_e2e
        displayName: 可安装包 init 端到端（生成骨架 → 跑门禁）
        pythonVersion: "3.13"
        commands:
          - python -m venv /tmp/ag && /tmp/ag/bin/python -m pip install --quiet --upgrade pip && /tmp/ag/bin/python -m pip install --quiet packages/allin-governance && /tmp/ag/bin/allin-governance init /tmp/scaffold && cd /tmp/scaffold && npm run check:governance
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      # 2026-11-08 整改 B8：Gitee 侧补齐与 GitHub 侧对称的测试 / 覆盖率 / 指标 / 冒烟步骤。
      # gates.yml:3 声称「两侧跑同一套命令」，此前本文件六个 step 全无这些命令。
      #
      # 合并裁断（2026-11-08）：远端原在此处还有一个 platform_unit 步骤（npm ci + npm test），
      # 与本文件上游的 platform_test（第 78 行，本分支 B1 闭环）命令完全重复 —— 同一批
      # node --test 跑两遍是纯浪费，且两处口径将来会漂移。删平台侧重复项，保留本分支的
      # platform_test；远端在 GitHub gates-windows 内联的那份保留（Windows 侧唯一覆盖）。
      - step: build@python
        name: python_tests_cov
        displayName: Python 单测与分支覆盖率（B1/B8）
        pythonVersion: "3.13"
        commands:
          - .venv/bin/python -m pytest kernel/tests packages/allin-governance/tests tools/repocheck/test_scanner.py -q --cov=kernel --cov=allin_governance --cov-branch --cov-report=term-missing
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      # 治理指标（B9/B10）：从远端原 metrics_and_security 步骤里**拆出来单独成步**。
      # 原步骤把「指标」与「安全扫描」混在一起，其中两条安全命令已下线（见下）：
      #   · `.venv/bin/python -m pip_audit -s osv` —— 与本文件 python_sast 步骤（共用脚本
      #     scripts/run-python-sast.sh）重复扫描；且该步骤阻断口径与仓内既定决策相反。
      #   · `.venv/bin/python -m bandit ... || echo "SAST_REVIEW_REQUIRED..."` —— 同上重复，
      #     且 `|| echo` 把非 0 吞成 0，违反本仓「SKIPPED is not a pass」纪律。
      # Python SAST/依赖审计统一由 python_sast 步骤执行（双侧共用一个脚本，不漂移）。
      - step: build@python
        name: metrics
        displayName: 治理指标（B9/B10；指标口径由 gate_metrics.py 自检）
        pythonVersion: "3.13"
        commands:
          - .venv/bin/python tools/gate/gate_metrics.py --snapshot --strict --json
          - .venv/bin/python tools/gate/gate_metrics.py --selfcheck
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      # Node 侧 SCA（供应链）：远端原 metrics_and_security 里那两条 npm audit 的覆盖，
      # 按本仓纪律重写为共用脚本 scripts/run-node-sca.sh（GitHub node-sca job 调同一脚本）。
      # shadow 模式：发现不阻断；端点不可达如实记为 caveat 而不是假称 0 漏洞、也不直接判红
      # （境内 runner 端点可达性未验证，直接阻断会让 Gitee 永久红）。
      - step: build@nodejs
        name: node_sca
        displayName: Node 依赖漏洞扫描（npm audit · 与 GitHub 侧同一脚本）
        nodeVersion: "22"
        commands:
          - bash scripts/run-node-sca.sh --selfcheck && bash scripts/run-node-sca.sh
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

      - step: build@nodejs
        name: website_smoke
        displayName: 官网冒烟（B8，与 GitHub website-smoke job 同命令）
        nodeVersion: "22"
        commands:
          - npm ci --prefix website && npm run bootstrap --prefix website && npm run smoke --prefix website && npm test --prefix website
        settings: []
        caches: []
        notify: []
        strategy:
          retry: "0"

triggers:
  trigger: auto
  push:
    branches:
      precise:
        - master
  pr:
    branches:
      precise:
        - master

notify: []

strategy:
  blocking: true
