# allin 门面站点 · GitHub Pages 部署
#
# 目的：把 `site/` 目录发布成 https://siwpan95.github.io/allin/ ——
# 让「外部的人第一次看到 allin」时，落地页直接讲清三件事：
# 这是什么 / 10 分钟怎么跑起来 / 哪些东西可以直接拿走。
#
# 为什么用 Actions 部署而不是「从分支直接发布」：
#   GitHub Pages 的 source/path 只接受 `/` 或 `/docs`（实测 API 报错：
#   "Invalid property /source/path: `/site` is not a possible value"），
#   而 `site/` 放在仓根是刻意选择 —— `docs/` 下放 .html 会被 g13-docs-only
#   门禁拦（docs/ 只允许文档类扩展名），所以门面不能放进 docs/。
#   Actions 部署绕开这个限制，且能顺手在发布前再跑一次门禁。
#
# 与 gates.yml 的分工：gates.yml 负责**验证**（门禁全绿才谈得上发布），
# 本文件负责**发布**。两者独立，但本文件在部署前会重跑一次门禁，
# 保证「发出去的东西」和「验过的东西」是同一份。
#
# 2026-11-07 运行时升级（与 gates.yml 同批）：checkout v7.0.1 / setup-node v7.1.0 /
# setup-python v7.1.0 / configure-pages v6.0.0 / deploy-pages v5.0.1 全部迁到
# node24，SHA 与官方 tag、dependabot PR #7/#10/#11/#12/#13 核对一致。
# 另有 upload-pages-artifact v3 → v5.0.0：它是 composite action，内部依赖
# upload-artifact v7；必须与 deploy-pages v5 同批升级，否则 Pages 产物链新旧混用
# （dependabot 未为它开 PR，此项按官方 tag 自行核对）。

name: deploy-pages

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: 发布门面站点
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: bootstrap（建别名，否则 g15 的 D6 会假红）
        run: bash scripts/bootstrap.sh

      - name: 发布前复跑门禁（保证「发出去的」与「验过的」是同一份）
        env:
          ALLIN_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: node tools/gate/governance/run.ts --no-profile

      - name: 配置 Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: 上传站点产物（只发 site/ 目录）
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
