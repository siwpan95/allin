[pytest]
# 仓根默认收集口径（2026-11-08 整改 B1/B6）：
#   vendor/cordis 是内联第三方，自带 pytest-asyncio + asyncio_mode=auto，
#   但其配置只在 vendor 子目录生效；从仓根收集会拿到 134 个 async 用例却缺插件，
#   导致整批 exit 1 并连带污染 pytest_cov 的覆盖率产出。
#   这里显式把内联第三方移出默认收集；第三方自身测试须在 vendor/cordis 目录
#   用其自带依赖集单独运行（见 vendor/cordis/pyproject.toml 的 [test] extra）。
testpaths =
    kernel/tests
    packages/allin-governance/tests
    tools/repocheck
norecursedirs =
    vendor
    preset
    .venv
    node_modules
    site
    website
    platform
    docs
    scripts
    architecture
    audit-fragments
    wiki
    .git
python_files = test_*.py
addopts = -q
