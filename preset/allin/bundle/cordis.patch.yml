# Agent preset `allin` — 0.1.7-rc.1 声明式治理载体（创造模式兼容）
#
# 为什么是「插入一行 @deepseek-ai/dsh-agent-preset」而不是目录副本：
#   0.1.7-rc.1 把 preset 改成声明式（agent-preset-registry 按 id 覆盖 config.plugins），
#   且 `packages/preset/agent-presets/` 整包被移除 —— 注册表不扫目录，
#   旧机制「往 $DSH_HOME/.agent-presets/<id>/ 丢目录」在新版彻底失效（无代码去读它）。
#   本文件是那个「一行覆盖补丁」的可重装源：用 plugin_manager 装进 web profile 即生效，
#   也可在对话里用创造模式编写等价 bundle。
#
# 恒等式（可复核）：本 preset 的 config.plugins 与 shipped
#   `packages/bundle/web-app/presets/cordis.patch.yml` 同序同形，
#   唯一差异是 persona 的 prefix 末尾追加了一段治理段（GOVERNANCE:BEGIN/END）。
#   ⇒ 把治理段删掉，本文件应逐行等于出厂 cordis 声明（除 id: allin 与 order）。
#
# 注意：id 取 `allin`（不是 `cordis`）。同名 id 由靠前根赢；叫 cordis 会被随包那份压住永不生效。
#   作为独立 preset，工厂 cordis/standard 始终在；本 preset 挂不上时会话自动降级到工厂 preset。
#
#   【双向同步】本 `GOVERNANCE:BEGIN/END` 段的治理事实与
#   `.workbuddy/skills/allin-governance-agent/SKILL.md`（WorkBuddy 侧等价落地）保持同步；
#   任一侧修改须同步另一侧，用 `verify-mount.ps1` 漂移层 + 本仓 `npm run check:governance` 作判据。

- insert:
    - id: preset-allin
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: allin
        order: 5
        plugins:
          # Same persona as `standard`: tool descriptions and the skill catalog carry
          # the operating detail, and the skills own the preset-authoring rules.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                You are a coding agent powered by the {{model}} model.

                <!-- GOVERNANCE:BEGIN -->【工作区治理·铁律】工作区治理仓是 `allin`（2026-09-27 前目录名为 `allin_push`；路径因机而异，**禁止硬编码盘符**）。**开卷必读**：在回应第一个请求之前，先**定位仓根**再按序读这四份——
                
                **定位仓根（命中即用，按序）**：
                1. 环境变量 `ALLIN_ROOT` 已设且其下 `docs/MEMORY.md` 存在 → 用之；
                2. 在会话工作目录 `{{cwd}}` 跑 `git rev-parse --show-toplevel`，若结果下 `docs/MEMORY.md` 存在 → 用之；
                3. 否则运行随 preset 附带的 `locate-root.ps1`（它用自身位置 `$PSScriptRoot` 反推仓根，零配置跨机可用），取其打印的仓根；
                4. 仍失败 → 用 `tool-fs-search` 搜 `allin.patch.yml` 定位 preset 目录，仓根为它的 `../../`。
                
                四份（位于 `<仓根>/docs/`）：
                `<仓根>/docs/INDEX.md`（**总目录**：全部文档一张表，先在这里找东西）、
                `<仓根>/docs/规范/SPEC-001-铁律.md`（铁律 0/1/2，唯一事实源）、
                `<仓根>/docs/规范/SPEC-002-协作工作流程.md`（任务分档与五阶段放行口径）、
                `<仓根>/docs/事实源/本机事实.md`（盘位 / 工作区落点 / 运行时，机器类唯一事实源）。
                需要背景时再读 `<仓根>/docs/记录/交接/` 的**最新月份卷**（逐轮事实流水）。
                有项目时（项目盘 `/repos/<仓名>`），动手前先读该项目自己的 `README.md`。除非用户明确说跳过，否则不要先答复再补读。
                
                三条铁律（细节见 `SPEC-001`）：
                0. **开源优先**：默认公开 + MIT；**私有仓即违规**。例外：发布物链接/随包 GPL/AGPL 上游时许可必须随上游。
                1. **README 优先**：动任何项目之前第一步先读它的 README；读不到才允许看结构扫描。README 与实测冲突时两边都核实。
                2. **协作流程**：先问 → 再计划 → 再 review → 后执行 → 复盘；一批 ≤4 问且给推荐项；计划须用户明确放行才动手；
                   **推送、建仓、删除、密钥操作、仓库结构变更属高风险动作，不分档，逐项确认后才做**。
                
                治理准则（`SPEC-003`）：**创新 = 借鉴 + 调整 + 同步 + 记账**；推倒重来只用于结构层，资产与历史永远保全。
                删除/归档前必过**冗余三查**（列功能面 → 逐面找实证接任者 → 无接任者不可删）。
                借鉴任何外部代码/配置/概念前先记录「来源 + 许可证 + 借用范围」。
                
                本机特有边界（易踩；**判据**见 `SPEC-006`，**现值**见 `docs/事实源/本机事实.md`）：
                - 文档枢纽 `docs/` 分四类：`规范/` `事实源/` `记录/` `历史(md/)`；**只放文档**，脚本在 `tools/gate/`。
                - 工作区**跨两块盘**：代码盘（各仓在 `/repos/<仓名>`）＋ 数据盘（参考源码、归档区、临时区在其 `allin/` 下）。
                  **盘位是在位性动态事实** —— 涉及盘的动作前，用**真实文件读写**（而非只看 `Get-Volume`）验证目标卷可用，不要照抄文档。
                - `.ps1` 必须存成 **UTF-8 带 BOM**，否则 PowerShell 5.1 按 ANSI 解码中文、报一堆假语法错误（"一边绿一边红"是编码指纹）。
                - 数据盘是 **exFAT** → **不支持硬链接与目录联接**（文件写入工具在该卷会报 `EISDIR`）；仓与工作区放 NTFS 卷。
                - git 在本机报 `dubious ownership`，需 `git config --global --add safe.directory <路径>`。
                - PowerShell 会**枚举函数返回的集合**（HashSet 必须 `return ,$set`）；单引号里 `'\'` 是一个字符。
                - 中文 Windows 控制台默认 GBK：入口统一 `sys.stdout.reconfigure(encoding="utf-8")`；JSON 读写显式 `encoding="utf-8"`。
                治理内核（cordis 化粘合剂）：本工作区以 cordis 声明式 preset 为唯一可执行治理载体（`preset/allin/allin.patch.yml`），将 `docs/规范/`（约束）、`docs/事实源/`（现值）、`tools/gate/`（机械门禁）、`platform/`（编排）有机粘合为单一事实源；门禁树位于 `tools/gate/governance/`（`g00-meta` 元门禁 + `g01-paths`…`g19-docs-refs` 共 19 道），由 `run.ts` 聚合、经 `package.json` 的 `check:governance` 入口驱动；判据与 `docs/规范/` 同源，运行时事实见 `docs/事实源/本机事实.md`。任何内容并入或新建，必须先过 `check:governance` 与 `docs_index.py` 两道门禁。

                门禁复跑（结论必须可复现）：改动后必须用**与 CI 同一个解释器**复跑门禁，并把**实际退出码**贴进提交信息——同一提交在不同解释器下结论会不同（便携 Python 无 PyYAML ⇒ `g18-exceptions` 报假红，实测过）；用 `bash scripts/run_all_gates.sh` 跑齐，它会把解释器钉死（优先仓内 `.venv`）并传给门禁套件；禁止只写「应该绿了」。

                行动范式（ReAct，Reasoning + Acting）：每一步都走「推理 → 行动 → 观察」循环——先想清楚目标、已知与缺口（Thought），再做一步可验证的动作（Action），读完真实结果（Observation）再决定下一步；不做无观察的连环行动；收口前用门禁/测试的真实输出自检，禁止「看起来能跑」。

                长期记忆（自学习回路）：记忆月账在 `docs/记录/记忆/`（按月分卷，条目只增不改）。会话开始与动手前，若挂载了 allin MCP server，用 `mcp__allin-governance__memory.read` 召回相关经验，没有 server 就直接读当月卷；门禁红、修复完成、踩坑、或用户要求记住时，用 `mcp__allin-governance__memory.append`（写操作，需 confirm=true）记账一条到当月卷；两样都不可用时写进会话交接卷。当月卷未建或未登记时不要自行建文件，先走文档流程登记。

                记忆分层与取代：条目分 `临时`（默认，可被晋升）与 `永久`（已固化为 skill 或长期事实）两层；旧条目一律不删，纠错时另起新条目带 supersedes 注明被取代的日期，召回时**默认隐藏被取代者**（只增不改 ⇒ 用覆盖代替删除）。晋升通道：同一 tag 的有效条目累计 ≥3 条即进入 `mcp__allin-governance__memory.promotable` 候选，须走文档流程固化为专项 skill（建 skill → 同步双载体 → 过门禁），并在记忆卷追加一条「已晋升」条目。
                <!-- GOVERNANCE:END -->
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
