id: dsh-release-archiver
name: DSH 发布源码归档流水线
category: tool
version: 0.1.0
path: repos/dsh-release-archiver
status: active
manual: true
note: >-
  2026-11-02 建项：把「每周检测 deepseek-ai/deepseek-harness 的 releases → 双格式源码归档 →
  完整性校验 → 解压复核」从会话里的一次性命令固化为可版本化脚本与判据。四个脚本：
  weekly_check.sh（只读差集，API 失败不冒充「无新增」）、dl_one.sh（逐字沿用本工作区技能
  github-release-source-archive-download）、archive_one.sh（串行编排）、verify_tag.sh
  （硬指标唯一实现：文件数+符号链接数 == zip 条目数、失效链接 0）。归档本体不入库，
  落点由 DSH_ARCHIVE_ROOT 指定（不写死盘符）。**本仓只有本地首提交 `3755c4c`，
  尚未建远端**（按铁律 3，建仓与推送逐项确认后才做）。
launch:
  # 无常驻服务；入口是只读检测脚本
  command: bash scripts/weekly_check.sh
verify:
  # 无副作用的语法自检（不需要 DSH_ARCHIVE_ROOT）；硬指标复核要带 tag 参数，见 README
  command: bash -n scripts/archive_one.sh && bash -n scripts/weekly_check.sh && bash -n scripts/verify_tag.sh
