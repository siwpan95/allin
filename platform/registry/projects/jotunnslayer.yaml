id: jotunnslayer
name: JOTUNNSLAYER 复刻
category: game
gameplay: [survivor]
version: 1.0.0
path: repos/jotunnslayer
manual: true
launch:
  command: python main.py
publish:
  repo: siwpan/jotunnslayer
verify:
