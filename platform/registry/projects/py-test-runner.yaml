id: py-test-runner
name: 测试运行器
category: tool
version: 1.0.0
path: repos/py_test_runner
manual: true
# 2026-11-24 订正：本地仓已按 0.0.0a8 的裁决并入 allin（`tools/_shared/pytrunner`，
# 另发 PyPI `pytrunner` 1.0.0），`repos/py_test_runner` 在发布区已不存在。
# 此前未标状态 ⇒ loadRegistry 每次报「path 不存在」，而 platform 测试用
# PLATFORM_PATH_CHECK=absolute 把存在性检查关掉了，于是这条漂移长期无人看见
# （2026-11-24 上线前全检实测：entries=82 / problems=1）。
# 标 archived 后按 isTombstone 豁免存在性；条目留在清单里作历史，不删（删要 g08 证据）。
#
# 为什么是 archived 而不是 retired：**两层词表不一致**（F-13，已单独记账）——
# `platform/packages/core/src/registry.js` 的 TOMBSTONE_STATUS = {archived, retired}，
# 而门禁 `tools/gate/governance/gates/g17_registry.py` 的 ALLOWED_STATUS
# = {active, dormant, archived, deprecated}。交集只有 archived。
status: archived
launch:
  command: python main.py
publish:
  repo: siwpan/py_test_runner
  branch: master
verify:
  # 2026-10-26 补：仓里既有入口实测可无头跑通（退出 0），见 tools/gate/audit/projects_verify.json
  command: python main.py --smoke
