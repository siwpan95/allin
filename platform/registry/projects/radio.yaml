id: radio
name: 电台
category: music
version: 4.0.0
path: repos/private-radio-stations
port: 8000
launch:
  command: npm run radio
verify:
  # 2026-10-26 补：仓级测试可无头跑通（退出 0）；服务本身仍按 port/health 探活。
  command: npm run test
stop:
  command: stop-radio.bat
health:
  url: http://localhost:8000/api/status
publish:
  repo: siwpan/private-radio-stations
  # 有意发布非默认分支：远端默认 master，但 3.0 分支确实存在（2026-11-13 扫描核实）。
  # workshop.js 按本字段 clone/fetch，勿改成 default_branch。
  branch: "3.0"
