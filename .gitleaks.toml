# gitleaks 判读基线 —— 让「全历史扫描」的结论可执行
#
# 为什么需要这个文件：`scripts/scan-secrets.sh` 只扫「本次新增行」，判定永远干净；
# 但**全历史**扫描（`gitleaks git .`）在 2026-11-24 实测报 23 条 —— 逐条核对后
# **全部是自检夹具，0 条真密钥**。不建基线的话，这 23 条会永远亮在那里，
# 半年后没人再看得懂哪条是新的（和「狼来了」同一个失效模式）。
#
# 三条基线的依据（2026-11-24 逐条核对，证据留在 REC-AU-33）：
#   ① 21 条：本仓自检夹具，行内已带仓库自有豁免注解 —— `gov-credentials` 的 allow 注解（g03_credentials.py）
#      与 `repo-hygiene` 的 allow 注解（repo_hygiene.py）。
#      **一套注解、两个扫描器都认**：g03/repo_hygiene 认它，gitleaks 也认它。
#   ② 2 条：`docs/记录/交接/2026-09.md` 的表格**逐字记录了夹具值**（用来解释
#      「不是事故、无需轮换、无需清历史」）。按**字面值**豁免，不按整文件豁免 ——
#      该文件里将来若出现别的密钥，照样会报。
#   ③ 1 条：`c46e13ae` 的 `deploy/graphrag/build_input.py` 夹具行，该行已在后续
#      重构中删除（当前树 grep 不到），按**提交**精确豁免。
#
# 用法（只用于全历史审计，不接进增量脚本 —— 增量面本来就只有新增行）：
#   gitleaks git . --config .gitleaks.toml --redact -f json -r <报告路径>
#
# ⚠ 版本口径：本文件按 gitleaks 8.30.x 的配置语法写（顶层 `[[allowlists]]`）。
#   CI 固定的 8.18.4 用旧语法（`[allowlist]` 单张表），**不读本文件**（脚本也没传
#   --config），所以不影响 CI；本地若有 8.18.x 想用全历史档，需先升级二进制。

[extend]
useDefault = true

# ① 行内注解即豁免：与仓库既有的凭据注解体系共用同一行标记
[[allowlists]]
description = "自检夹具：行内带仓库自有豁免注解（g03_credentials / repo_hygiene 认的那套）"
regexTarget = "line"
regexes = [
  # 写成 `a[l]low` 而不是直接写 allow：仓库的「注解越权」判据认的是**字面**
  # 服务名加冒号加 allow 这一串，本文件若原样写出，会让每一次增量扫描都判 exit 2
  #（2026-11-24 实测撞过）。字符类在正则里完全等价，别"简化"它。
  '''gov-credentials:\s*a[l]low''',
  '''repo-hygiene:\s*a[l]low''',
]

# ② 历史记录里逐字抄录的合成夹具值（按字面值，不按文件）
[[allowlists]]
description = "交接卷正文记录的合成夹具值（2026-09 已判定：非事故、无需轮换）"
regexes = [
  '''sk-live-DO-NOT-LOG-abcdef123456''',
  '''SYNTHETIC_SECRET_NOT_A_REAL_CREDENTIAL''',
  '''sk-e2efixture1234567890''',
  '''a1b2c3d4e5f67890abcdef1234567890''',  # gov-credentials: allow（自检夹具值）
  '''b2c3d4e5f67890abcdef1234567890ab''',  # gov-credentials: allow（自检夹具值）
]

# ③ 单条历史提交里的夹具行（当前树已无此字符串）
[[allowlists]]
description = "c46e13ae 的 build_input.py 夹具行（后续重构已删除该行）"
commits = ["c46e13ae0943f79922e0c9c9577f10cce99ac761"]
