id: video
name: 视频转播站
category: media
version: 4.0.0
path: repos/private-radio-stations
port: 8100
launch:
  command: npm run video
verify:
  # 2026-10-26 补：与 radio 同一工作区，仓级测试可无头跑通（退出 0）。
  command: npm run test
stop:
  command: stop-video.bat
health:
  url: http://localhost:8100/api/status
publish:
  repo: siwpan/private-radio-stations
  # 有意发布非默认分支：远端默认 master，但 archived-video 分支确实存在
  # （2026-11-13 扫描核实）。勿改成 default_branch。
  branch: archived-video
